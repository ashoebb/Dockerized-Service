version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/dockerized-node-service:${IMAGE_TAG:-latest}
    container_name: dockerized-node-service
    ports:
      - "3000:3000"
    environment:
      - SECRET_MESSAGE=${SECRET_MESSAGE:-This is a secret message!}
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-supersecretpassword}
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s